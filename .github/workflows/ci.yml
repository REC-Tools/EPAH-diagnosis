name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test tools
        run: |
          pip install -e .
          pip install pytest

      - name: Run tests
        run: pytest -q

      - name: Validate methodology registry (offline)
        run: python scripts/check_framework.py

      - name: Validate verification matrix
        run: python -m epah_diagnosis.cli validate-matrix data/verification_matrix.csv --catalog config/indicators.json
