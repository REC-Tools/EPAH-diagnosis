name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test tools
        run: |
          pip install -e .
          pip install pytest

      - name: Run tests
        run: pytest -q

      - name: Validate methodology registry (offline)
        run: python scripts/check_framework.py

      - name: Validate verification matrix
        run: python -m epah_diagnosis.cli validate-matrix data/verification_matrix.csv --catalog config/indicators.json

      - name: Validate canonical municipality ISTAT codes
        run: python scripts/check_municipality_registry.py

      - name: Compare historical official heating degree days
        run: python scripts/verify_heating_degree_days.py

      - name: Check building-stock draft and review-gate CLIs
        run: |
          python scripts/prepare_building_stock.py --help
          python scripts/finalize_building_stock_single_source.py --help

      - name: Check territorial context preparation and review-gate CLIs
        run: |
          python scripts/prepare_territorial_context.py --help
          python scripts/finalize_mean_altitude.py --help
          python scripts/finalize_snai_classification.py --help

      - name: Smoke-test DEA preparation and reviewed-promotion CLIs
        run: |
          python scripts/prepare_dea_accessibility.py --help
          python scripts/finalize_dea_accessibility.py --help

      - name: Check school and rail preparation / reviewed finalizer CLIs
        run: |
          python scripts/prepare_education_rail_access.py --help
          python scripts/finalize_upper_secondary_accessibility.py --help
          python scripts/finalize_rail_accessibility.py --help

      - name: Smoke-test full diagnostic bundle CLI
        run: python scripts/build_v0_1_bundle.py --help

      - name: Check priority official source audit CLI
        run: python scripts/audit_priority_sources.py --help

      - name: Record release blockers without failing CI
        run: python scripts/check_v0_1_readiness.py --phase release --report-only --json-out outputs/quality/v0_1_readiness.json

      - name: Upload readiness report
        uses: actions/upload-artifact@v4
        with:
          name: v0-1-readiness
          path: |
            outputs/quality/v0_1_readiness.json
            outputs/quality/heating_degree_days_comparison.json
          if-no-files-found: error
