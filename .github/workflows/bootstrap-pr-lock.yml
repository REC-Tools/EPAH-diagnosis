# TEMPORARY PR bootstrap; remove after the lockfile is committed.
name: Bootstrap resolved uv lock for PR
on:
  push:
    branches: ["feat/reproducible-build-dependency-lock"]

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - name: Resolve and commit the dependency lock
        run: |
          uv lock --python 3.11
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: lock Python and transitive dependencies"
            git push origin HEAD:feat/reproducible-build-dependency-lock
          fi
