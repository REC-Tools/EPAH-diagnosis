name: Temporary v0.2 test diagnostics
on:
  push:
    branches: ["feat/v0-2-technical-review-package-126"]
permissions:
  contents: write
jobs:
  capture-failure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - name: Build the locked environment
        run: uv sync --python 3.11 --locked --group dev
      - name: Capture pytest failures for the author
        run: |
          .venv/bin/python -m pytest -q > /tmp/v02_pytest.log 2>&1 || true
          tail -n 120 /tmp/v02_pytest.log > docs/_temporary_v02_ci_failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_temporary_v02_ci_failure.txt
          git commit -m "ci(debug): capture synthetic v0.2 pytest failures temporarily"
          git push origin HEAD:feat/v0-2-technical-review-package-126
