name: Update MEF income indicator

on:
  workflow_dispatch:
  schedule:
    - cron: "40 7 30 4 *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and checks
        run: |
          python -m pip install -e .
          python -m pip install pytest

      - name: Acquire proposed indicator update
        run: python scripts/finalize_mef_income.py

      - name: Validate change before proposing publication
        run: |
          python -m pytest -q
          python scripts/check_framework.py
          python -m epah_diagnosis.cli validate-matrix data/verification_matrix.csv --catalog config/indicators.json

      - name: Open a draft PR (NEVER push data to main)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/verification_matrix.csv data/indicators/; then
            echo 'No canonical data changes. No PR needed.'
            exit 0
          fi
          branch="data/auto-mef-income-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/verification_matrix.csv data/indicators/
          git commit -m 'data: proposed income_vulnerability refresh (review required)'
          git push --set-upstream origin "$branch"
          cat > /tmp/epah-pr-body.md <<'EOF'
## Automated source update — DRAFT / review required

Source-specific check: MEF income; validate fiscal year, population denominator and source URL.
Run unit tests and compare the diff to the official source before approving.
Do not merge an unreviewed data change. GitHub Actions bot-created PRs
may not automatically trigger other workflows: rerun checks after human updates.

Data-change: yes
Data-evidence: docs/indicator_02_income_vulnerability.md
Data-review: required
Data-revise: income_vulnerability

## Reviewer checklist
- [ ] Confirm actual source/version, license and archival checksum.
- [ ] Compare changed municipality values to original source records.
- [ ] Check year, denominator, gaps and unexpected regressions.
- [ ] Ensure CI checks run and an independent GitHub review is recorded.
EOF
          gh pr create --draft --base main --head "$branch" --title "data: review income_vulnerability refresh" --body-file /tmp/epah-pr-body.md
