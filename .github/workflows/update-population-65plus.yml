name: Update population 65+ indicator

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 15 4 *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e .

      - name: Acquire and validate ISTAT population 65+ data
        run: python scripts/finalize_population_65_plus.py

      - name: Validate verification matrix
        run: python -m epah_diagnosis.cli validate-matrix data/verification_matrix.csv

      - name: Commit updated indicator data
        run: |
          if git diff --quiet; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verification_matrix.csv data/indicators/
          git commit -m "data: update ISTAT population 65+ indicator"
          git push
