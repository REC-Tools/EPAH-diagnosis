[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epah-diagnosis"
version = "0.1.0"
description = "Local energy poverty diagnosis toolkit for Sinergie in Canavese"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "matplotlib>=3.8,<4",
  "pyshp>=2.3,<3",
  "pyproj>=3.6,<4",
  "cdsapi>=0.7.7,<1",
  "xarray>=2025.1,<2027",
  "netCDF4>=1.7,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
