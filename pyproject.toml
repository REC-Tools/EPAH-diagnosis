[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epah-diagnosis"
version = "0.1.0"
description = "Local energy poverty diagnosis toolkit for Sinergie in Canavese"
requires-python = ">=3.11"
dependencies = [
  "pyshp>=2.3,<3",
  "pyproj>=3.6,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
